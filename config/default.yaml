risk:
  max_position_usd: 25.0
  max_bankroll_pct: 0.25
  max_daily_loss_usd: 50.0
  max_simultaneous_positions: 1
  # Live paper: trade when model vs Polymarket mid differs enough and confidence clears.
  min_edge: 0.04
  min_confidence: 0.20
  max_spread: 0.06
  cooldown_seconds: 60
  emergency_stop: false

# Hybrid AI lean on top of lexicon sentiment. Needs GROQ_API_KEY or OPENAI_API_KEY.
# Auto-disables (no crash) when no key is set. Set BTC_POLY_AI_SENTIMENT=0 to force off.
ai_sentiment:
  enabled: true
  provider: auto   # auto | groq | openai
  model: ""        # blank = groq openai/gpt-oss-20b / openai gpt-4o-mini
  max_posts: 15
  timeout_seconds: 20
  lookback_seconds: 900
