# Research-first defaults. Live execution is off.

hypothesis: >
  Does a sudden change in real-time Bitcoin attention/sentiment contain
  predictive information about short-term BTC movement that is NOT already
  priced into Polymarket?

logging:
  level: INFO
  json: false

database:
  url: sqlite:///data/btcpoly.db
  echo: false

execution:
  enabled: false
  require_confirm_env: true

paper:
  starting_cash: 100.0
  fee_bps: 0
  slippage_bps: 50
  model_name: momentum_attn_v1
  # btcpoly run: fresh $100 book, skip the window you started in, news-sentiment gate
  reset_on_run: true
  wait_next_window_on_run: true
  require_fresh_btc_sentiment: true
  min_mention_count_900: 1
  min_sentiment_net_900: 0.08

kalshi:
  # Official USA-accessible exchange (replaces Polymarket).
  api_base: https://api.elections.kalshi.com/trade-api/v2
  series_ticker: KXBTC15M
  market_duration_minutes: 15
  order_min_size: 1.0
  # Optional hint: full Kalshi URL or ticker (short form ok). Auto-rolls via series.
  # Live at session start (~3:45pm PT Aug 28): kxbtc15m-26aug281900
  market_ticker: https://kalshi.com/markets/kxbtc15m/bitcoin-price-up-down/kxbtc15m-26aug281900
  exchange_name: kalshi

btc_market:
  windows_seconds: [10, 30, 60, 300, 900, 3600]
  # Spot is a feature. Resolution labels come from Kalshi YES/NO settlement.
  spot_source: binance
  # api.binance.com is often geo-blocked; vision mirror is public market data.
  binance_rest: https://data-api.binance.vision
  resolution_source: kalshi

attention:
  windows_seconds: [60, 300, 900, 3600]
  queries:
    - BTC
    - Bitcoin
    - $BTC
    - 比特币
    - 比特幣

ingest:
  limit: 15
  timeout_seconds: 60
  # 0 = poll again as soon as the last fetch finishes.
  interval_seconds: 0
  # Drop mentions older than this (minutes). Live trading needs fresh attention, not day-old news.
  max_age_minutes: 45
